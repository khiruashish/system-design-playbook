name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "coding-interview/**", "mkdocs.yml", "requirements.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "coding-interview/**", "mkdocs.yml", "requirements.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run coding-interview solutions (each must print PASS; outputs must match the docs)
        run: coding-interview/run-all.sh --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Build site (fails on broken links or missing snippets)
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
