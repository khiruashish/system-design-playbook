ci:
  snowflake:
    renew-every: 1h          # no background renewals during tests
  quorum:
    timeout: 2s              # first request hits a cold JVM (servlet init, JIT): 200 ms made the first write flaky
    replicas:                # QuorumIT runs the server on a fixed port and calls itself over HTTP
      - http://localhost:18080/internal/replicas/a
      - http://localhost:18080/internal/replicas/b
      - http://localhost:18080/internal/replicas/c
logging:
  level:
    root: WARN
